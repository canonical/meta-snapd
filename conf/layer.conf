BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "snapd"
BBFILE_PATTERN_snapd = "^${LAYERDIR}/"
BBFILE_PRIORITY_snapd = "7"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_snapd = "1"
LAYERSERIES_COMPAT_snapd = "styhead walnascar whinlatter wrynose blacksail"
LAYERDEPENDS_snapd = "core filesystems-layer"
# Only needed for strict confinement (DISTRO_FEATURES apparmor)
LAYERRECOMMENDS_snapd = "security"
